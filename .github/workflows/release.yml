name: Build DMG and release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # project.xcproj requires Xcode 27.2. Override when hosted runners support it.
    runs-on: ${{ fromJSON(vars.MACOS_RUNNER || '["self-hosted","macOS","disk-awake"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check tools
        run: |
          xcodebuild -version
          command -v create-dmg
          command -v gh
      - name: Build Release app
        run: |
          xcodebuild -project 'Disk Awake.xcodeproj' -target MyApp \
            -configuration Release -sdk macosx \
            CONFIGURATION_BUILD_DIR="$GITHUB_WORKSPACE/build/Release" \
            OBJROOT="$RUNNER_TEMP/disk-awake-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" build
      - name: Choose release name
        id: release
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_TYPE" == tag ]]; then
            tag="$REF_NAME"
          else
            tag="build-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:7}"
          fi
          [[ "$tag" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || exit 1
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Package DMG
        env:
          DMG_BACKGROUND: ${{ vars.DMG_BACKGROUND }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: bash scripts/package-dmg.sh 'build/Release/Disk Awake.app' "dist/Disk-Awake-${RELEASE_TAG}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: Disk-Awake-${{ steps.release.outputs.tag }}
          path: dist/*
          if-no-files-found: error
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          options=()
          if [[ "$REF_TYPE" != tag ]]; then
            options+=(--prerelease --latest=false)
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* \
              --target "$GITHUB_SHA" --title "Disk Awake $RELEASE_TAG" \
              --generate-notes "${options[@]}"
          fi
